name: Code health Pages

on:
  push:
    branches:
      - master
    paths:
      - '**/*.lua'
  workflow_dispatch:

concurrency:
  group: codehealth-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/codehealth-requirements.txt

      - name: Install report dependencies
        run: |
          python -m pip install jinja2==3.1.6
          python -m pip install --requirement scripts/codehealth-requirements.txt

      - name: Install jscpd
        run: |
          npm install --prefix "$RUNNER_TEMP/jscpd" jscpd@5.0.16
          echo "$RUNNER_TEMP/jscpd/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Log tool versions
        run: |
          python3 --version
          lizard --version
          jscpd --version
          graphify --version

      - name: Test report contract
        run: python3 scripts/codehealth_report_test.py

      - name: Build code-health site
        run: scripts/codehealth.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: tmp/codehealth-site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
