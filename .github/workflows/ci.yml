name: CI

# Runs the static checks and the synthetic test suite on every push and pull
# request. No ROM is involved: all fixtures are generated by the tests
# themselves, so this is safe to run publicly. The real-ROM integration test
# (scripts/integration.sh) needs a legally-owned cartridge dump and is never run
# here.
#
# The lint steps mirror the pre-commit hook (scripts/lint.sh). Hooks are opt-in
# per clone and bypassable, so CI is the binding gate.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install stylua
        env:
          STYLUA_VERSION: "2.5.2"
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/stylua.zip" \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/v${STYLUA_VERSION}/stylua-linux-x86_64.zip"
          sudo unzip -j "$RUNNER_TEMP/stylua.zip" stylua -d /usr/local/bin
          sudo chmod +x /usr/local/bin/stylua

      - name: Install lua-language-server
        env:
          LUALS_VERSION: "3.19.0"
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/luals.tar.gz" \
            "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz"
          sudo mkdir -p /opt/lua-language-server
          sudo tar -xzf "$RUNNER_TEMP/luals.tar.gz" -C /opt/lua-language-server
          printf '#!/bin/sh\nexec /opt/lua-language-server/bin/lua-language-server "$@"\n' \
            | sudo tee /usr/local/bin/lua-language-server >/dev/null
          sudo chmod +x /usr/local/bin/lua-language-server

      - name: Run static checks
        run: scripts/lint.sh

      - name: Download LÖVE 11.5
        env:
          LOVE_VERSION: "11.5"
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/love.AppImage" \
            "https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/love.AppImage"
          "$RUNNER_TEMP/love.AppImage" --appimage-extract-and-run --version

      - name: Install offscreen graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0

      - name: Run test suite
        env:
          SDL_VIDEODRIVER: offscreen
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '%s\n' '#!/bin/sh' 'exec "$RUNNER_TEMP/love.AppImage" --appimage-extract-and-run "$@"' > "$RUNNER_TEMP/bin/love"
          chmod +x "$RUNNER_TEMP/bin/love"
          PATH="$RUNNER_TEMP/bin:$PATH" scripts/test.sh
