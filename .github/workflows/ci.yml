name: CI

# Runs the synthetic test suite on every push and pull request. No ROM is
# involved: all fixtures are generated by the tests themselves, so this is safe
# to run publicly. The real-ROM integration test (scripts/integration.sh) needs
# a legally-owned cartridge dump and is never run here.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # LÖVE 11.5 from the upstream stable PPA, plus xvfb so LÖVE can start
      # even though --test disables the window and GPU modules (see conf.lua).
      - name: Install LÖVE 11.5
        run: |
          sudo add-apt-repository -y ppa:bartbes/love-stable
          sudo apt-get update
          sudo apt-get install -y love xvfb
          love --version

      - name: Run test suite
        run: xvfb-run -a love . --test
