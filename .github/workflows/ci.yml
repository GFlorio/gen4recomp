name: CI

# Runs the synthetic test suite on every push and pull request. No ROM is
# involved: all fixtures are generated by the tests themselves, so this is safe
# to run publicly. The real-ROM integration test (scripts/integration.sh) needs
# a legally-owned cartridge dump and is never run here.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Download LÖVE 11.5
        env:
          LOVE_VERSION: "11.5"
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/love.AppImage" \
            "https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/love.AppImage"
          "$RUNNER_TEMP/love.AppImage" --appimage-extract-and-run --version

      - name: Run test suite
        run: '"$RUNNER_TEMP/love.AppImage" --appimage-extract-and-run . --test'
